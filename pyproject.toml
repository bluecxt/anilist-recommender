[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anilist-recommender"
version = "0.1.0"
description = "Local CLI that recommends anime & manga from your AniList profile using the collaborative recommendation graph, local CPU vector search (sqlite-vec) and a local Ollama LLM."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "anilist-recommender" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "openai>=1.40",
  "typer>=0.12",
  "rich>=13.7",
  "sentence-transformers>=3.0",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
anilist-rec = "anilist_recommender.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/anilist_recommender"]

[tool.ruff]
line-length = 100
target-version = "py312"
